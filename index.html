<style>
  :root {
    --bg: #0a0a0b;
    --surface: #121214;
    --surface-hover: #17171b;
    --border: #232326;
    --text: #ededee;
    --muted: #6e6e76;
    --accent: #a5b4fc;
    --accent-dim: rgba(165, 180, 252, 0.4);
    --glow: rgba(165, 180, 252, 0.06);
    --glow-strong: rgba(165, 180, 252, 0.09);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* мягкое свечение на фоне */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 500px;
    background: radial-gradient(ellipse at center, var(--glow), transparent 70%);
    pointer-events: none;
  }

  /* едва заметная сетка-виньетка по краям */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
    pointer-events: none;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 350px;
    z-index: 1;
  }

  .fade-in {
    opacity: 0;
    transform: translateY(14px);
    animation: enter 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes enter {
    to { opacity: 1; transform: translateY(0); }
  }

  header {
    text-align: center;
    margin-bottom: 2.6rem;
  }

  .avatar {
    position: relative;
    width: 78px;
    height: 78px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    background: linear-gradient(145deg, #1a1a1e, #0d0d0f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.55rem;
    color: var(--accent);
    transition: color 0.4s ease;
    user-select: none;
  }

  /* тонкое кольцо вокруг аватара */
  .avatar::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    padding: 1px;
    background: linear-gradient(160deg, var(--accent-dim), rgba(35, 35, 38, 0.6) 45%, rgba(35, 35, 38, 0.6) 60%, var(--accent-dim));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.35rem;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  #nick {
    cursor: pointer;
    user-select: none;
    transition: color 0.3s ease;
  }

  #nick:hover { color: var(--accent); }

  /* свечение за курсором */
  .cursor-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 340px;
    height: 340px;
    margin: -170px 0 0 -170px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow-strong), transparent 65%);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
    will-change: transform;
  }

  h1::after {
    content: '_';
    color: var(--accent);
    transition: color 0.4s ease;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .handle {
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0.85rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    text-align: left;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 400;
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease,
                transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.25s ease;
  }

  .link:hover, .link:focus-visible {
    border-color: var(--accent-dim);
    background: var(--surface-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px -8px rgba(0, 0, 0, 0.6);
  }

  .link:focus-visible {
    outline: none;
  }

  .link:active {
    transform: translateY(0);
    box-shadow: none;
  }

  .link .name {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .link .sub {
    display: block;
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 300;
    margin-top: 0.15rem;
    letter-spacing: 0.02em;
    transition: color 0.25s ease;
  }

  .link:hover .sub { color: #8b8b93; }

  .link svg {
    width: 17px;
    height: 17px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.25s ease, transform 0.25s ease;
    flex-shrink: 0;
  }

  .link:hover svg { stroke: var(--accent); }

  .link .arrow {
    width: 15px;
    height: 15px;
    stroke: var(--muted);
    transition: stroke 0.25s ease, transform 0.25s ease;
  }

  .link:hover .arrow {
    stroke: var(--accent);
    transform: translate(2px, -2px);
  }

  .link .copy-icon {
    width: 15px;
    height: 15px;
    stroke: var(--muted);
    transition: stroke 0.25s ease;
  }

  .link:hover .copy-icon { stroke: var(--accent); }

  .copied {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translate(-50%, 10px);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease, color 0.4s ease;
    z-index: 10;
  }

  .copied.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  footer {
    margin-top: 2.6rem;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.55;
    letter-spacing: 0.04em;
  }

  /* переключатель темы */
  .theme-btn {
    position: fixed;
    top: 1.2rem;
    right: 1.2rem;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.25s ease, transform 0.25s ease;
    z-index: 20;
  }

  .theme-btn:hover {
    border-color: var(--accent-dim);
    transform: scale(1.08);
  }

  .theme-btn svg {
    width: 13px;
    height: 13px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.25s ease;
  }

  .theme-btn:hover svg { stroke: var(--accent); }

  .theme-dots {
    position: fixed;
    top: 1.2rem;
    right: 3.4rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.65rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    opacity: 0;
    transform: translateX(6px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 20;
  }

  .theme-dots.open {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .dot:hover { transform: scale(1.25); }

  .dot.active {
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<main>

        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>

<button class="theme-btn" id="themeBtn" type="button" aria-label="Сменить тему">
  <svg viewBox="0 0 24 24"><path d="M12 2.7 6.7 8a7.5 7.5 0 1 0 10.6 0L12 2.7z"/></svg>
</button>

<script>
  // --- темы ---
  const themes = [
    { name: 'индиго',  accent: '#a5b4fc', rgb: '165, 180, 252' },
    { name: 'инферно', accent: '#fb923c', rgb: '251, 146, 60'  },
    { name: 'аква',    accent: '#67e8f9', rgb: '103, 232, 249' },
    { name: 'сакура',  accent: '#f9a8d4', rgb: '249, 168, 212' },
    { name: 'лайм',    accent: '#a3e635', rgb: '163, 230, 53'  },
  ];

  const themeBtn = document.getElementById('themeBtn');
  const themeDots = document.getElementById('themeDots');
  const root = document.documentElement;

  function applyTheme(i) {
    const t = themes[i];
    root.style.setProperty('--accent', t.accent);
    root.style.setProperty('--accent-dim', `rgba(${t.rgb}, 0.4)`);
    root.style.setProperty('--glow', `rgba(${t.rgb}, 0.06)`);
    root.style.setProperty('--glow-strong', `rgba(${t.rgb}, 0.09)`);
    themeDots.querySelectorAll('.dot').forEach((d, j) =>
      d.classList.toggle('active', j === i));
    localStorage.setItem('latency-theme', i);
  }

  themes.forEach((t, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot';
    dot.type = 'button';
    dot.title = t.name;
    dot.style.background = t.accent;
    dot.addEventListener('click', () => applyTheme(i));
    themeDots.appendChild(dot);
  });

  applyTheme(parseInt(localStorage.getItem('latency-theme')) || 0);

  themeBtn.addEventListener('click', () => themeDots.classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if (!themeBtn.contains(e.target) && !themeDots.contains(e.target))
      themeDots.classList.remove('open');
  });

  // --- свечение за курсором ---
  const glow = document.getElementById('cursorGlow');
  let gx = innerWidth / 2, gy = innerHeight / 2, tx = gx, ty = gy;
  let glowActive = false;

  if (matchMedia('(pointer: fine)').matches) {
    addEventListener('mousemove', (e) => {
      tx = e.clientX; ty = e.clientY;
      if (!glowActive) { glow.style.opacity = '1'; glowActive = true; }
    });
    (function follow() {
      gx += (tx - gx) * 0.08;
      gy += (ty - gy) * 0.08;
      glow.style.transform = `translate(${gx}px, ${gy}px)`;
      requestAnimationFrame(follow);
    })();
  }

  // --- пасхалка: LARPency ---
  const nick = document.getElementById('nick');
  const CHARS = 'abcdefghjkmnpqrstuvwxyz';
  let scrambling = false;

  function scrambleTo(el, target, done) {
    const from = el.textContent;
    const len = Math.max(from.length, target.length);
    let frame = 0;
    const total = 18; // кадров на переключение
    const steps = Array.from({ length: len }, (_, i) => Math.floor((i / len) * total * 0.7));

    (function tick() {
      let out = '';
      for (let i = 0; i < len; i++) {
        if (frame >= steps[i] + 6) out += target[i] || '';
        else if (frame >= steps[i]) out += CHARS[Math.floor(Math.random() * CHARS.length)];
        else out += from[i] || '';
      }
      el.textContent = out;
      if (++frame <= total + 6) requestAnimationFrame(tick);
      else { el.textContent = target; done && done(); }
    })();
  }

  nick.addEventListener('click', () => {
    if (scrambling) return;
    scrambling = true;
    scrambleTo(nick, 'LARPency', () => {
      setTimeout(() => {
        scrambleTo(nick, 'latency', () => { scrambling = false; });
      }, 2000);
    });
  });

  // --- discord: копирование ника ---
  const btn = document.getElementById('discord');
  const toast = document.getElementById('toast');
  let timer;

  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText('ceapeapea');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = 'ceapeapea';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 1800);
  });
</script>

</body>
